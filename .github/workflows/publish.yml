name: Publish to npm

# Berjalan saat Anda push git tag berformat v* (mis. v1.0.4),
# termasuk tag yang dibuat otomatis oleh GitHub Release.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # diperlukan untuk npm provenance (badge "verified")
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # templates/ is gitignored & generated from backend/frontend/docs.
      # The scaffold tests copy from it, so it must exist before testing.
      - name: Generate templates
        run: node packages/cli/scripts/copy-templates.js

      - name: Run tests (CLI)
        run: npm test --workspace=packages/cli

      # prepack (build + copy-templates) berjalan otomatis saat publish.
      - name: Publish package
        run: npm publish --workspace=packages/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
