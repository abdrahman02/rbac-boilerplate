services:
  mysql:
    image: mysql:8.0
    container_name: rbac_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-rbac_db}
      MYSQL_USER: ${DB_USER:-rbac_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rbac_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rbac_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USER:-rbac_user}
      PMA_PASSWORD: ${DB_PASSWORD:-rbac_password}
    ports:
      - "8080:80"

volumes:
  mysql_data:
